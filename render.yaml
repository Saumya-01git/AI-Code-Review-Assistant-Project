services:
  - type: web
    name: ai-code-review-assistant
    env: node
    plan: starter
    buildCommand: npm install && cd client && npm install && npm run build && cd ..
    startCommand: node server/src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
    disk:
      name: sqlite-data
      mountPath: /app/server/data
      sizeGB: 1
